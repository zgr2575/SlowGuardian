name: V10 CI

# Builds the V10 frontend and runs the proxy smoke tests. Scoped to v10/ so it
# stays independent of the legacy service-worker workflow (test-sw.yml).
on:
  push:
    branches: [main, "claude/**", develop]
    paths:
      - "v10/**"
      - "static/assets/media/icons/**"
      - ".github/workflows/v10-ci.yml"
  pull_request:
    paths:
      - "v10/**"
      - ".github/workflows/v10-ci.yml"

defaults:
  run:
    working-directory: v10

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        run: npm ci

      - name: Build the static frontend
        run: npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Proxy handshake test (wisp upgrade)
        run: |
          NODE_ENV=test PORT=8091 HOST=127.0.0.1 node src/server.js &
          SRV=$!
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8091/readyz >/dev/null; do sleep 1; done'
          PORT=8091 npm run test:wisp
          kill "$SRV" 2>/dev/null || true

      - name: End-to-end smoke test (Playwright)
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: v10/playwright-report/
          retention-days: 7

  docker-build:
    # Validate the canonical image builds (no push — GHCR publish is a 1.0
    # release step). Context is the repo root so the web build gets the icons.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: v10/Dockerfile
          push: false
          tags: slowguardian:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
